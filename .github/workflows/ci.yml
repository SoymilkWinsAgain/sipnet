name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:

  downscaling:
    name: Downscaling CPU tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.12.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r downscaling/requirements-test.txt
      - name: Run downscaling tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q downscaling/tests

  # Build and Integration Test
  build:
    strategy:
      fail-fast: false
      matrix:
        OS:
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
    runs-on: ${{ matrix.OS }}

    steps:
      # checkout source code
      - uses: actions/checkout@v2

      # install doxygen
      - name: Install Doxygen
        run:  |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install doxygen -y
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install --formula doxygen
          fi

      # compile SIPNET
      - name: compile sipnet
        run: make

      # run smoke tests
      - name: Run SIPNET smoke tests
        shell: bash
        run: tests/smoke/run_smoke.sh

  # Run Unit Tests
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        OS:
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
    runs-on: ${{ matrix.OS }}

    steps:
      # checkout source code
      - uses: actions/checkout@v2

      # compile unit tests
      - name: compile tests
        run: make test

      # run tests
      - name: Run Unit Tests
        run: make testrun
